name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15 # a hung test must not hold the build for the default six hours
    continue-on-error: ${{ matrix.os == 'windows-latest' }} # informational until it has proved stable
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04 # setup-python has no 3.9 build for newer images
            python-version: '3.9'
          - os: ubuntu-24.04
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - if: runner.os == 'Windows'
        run: pip install tzdata # Python on Windows has no time zone database of its own
      - run: python -m unittest discover -s tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install ruff==0.17.4
      - run: ruff check .
      - run: ruff format --check .

  # Compares with the plugins' main: after a limitwatch.py change it stays red until they are synced and pushed.
  vendored:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/carlocontaldi/claude-portavoce ../claude-portavoce
      - run: git clone --depth 1 https://github.com/carlocontaldi/claude-goon ../claude-goon
      - run: python3 sync.py --check

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint, vendored]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release with the commit subjects since the previous tag
        run: |
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          git log --format='- %s' ${previous:+$previous..}"$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
